[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Allows the Netlify Image CDN (/.netlify/images) to fetch TMDB images.
# Used only as a fallback when image.tmdb.org is unreachable for a visitor.
[images]
  remote_images = ["https://image\\.tmdb\\.org/.*"]

# Response headers live in public/_headers so they also apply to manual
# (drag-and-drop) deploys of the dist folder.
